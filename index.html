<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hand - Purified Video Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <header>
        <h1>THE HAND</h1>
        <p>Erase distractions and advertisements.</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="videoUrl" placeholder="Paste YouTube link here..." />
            <button onclick="playVideo()">Erase & Watch</button>
        </div>

        <div class="video-container" id="playerBox">
            <div class="placeholder">Paste a link above to launch the video in clean mode.</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
